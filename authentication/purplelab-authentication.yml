  conclusion: >-
    Undetermined. The SSO service name (healthnexussso) and the redirect chain are consistent with
    either a bespoke session scheme or an OAuth/OIDC implementation without published metadata.
    Recorded as unknown rather than guessed - see conformance/purplelab-conformance.yml#oauth2.

