conformance:
- id: hipaa-de-identification-expert-determination
  name: HIPAA De-identification - Expert Determination method (45 CFR 164.514(b)(1))
  conforms: true
  category: regulatory
  evidence:
    url: https://purplelab.com/product-privacy-policy
    http_status: 200
    quote: >-
      "PurpleLab's CLEAR Claims Data has been certified by qualified expert statisticians to meet
      HIPAA's de-identification standards under the Expert Determination method
      (45 CFR 164.514(b)(1))."
    kind: published-claim
  note: >-
    This is the strongest compliance assertion PurpleLab publishes and it names a specific
    regulatory method and citation, certified by named-class third parties (qualified expert
    statisticians). It is the basis for the apis.yml `Compliance` pointer. PurpleLab does NOT
    publish the determination report itself, an auditor name, or a validity period.

