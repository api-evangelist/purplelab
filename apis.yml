aid: purplelab
name: PurpleLab
description: >-
  PurpleLab is a healthcare data and analytics company headquartered in Wayne, Pennsylvania, whose
  HealthNexus platform gives life sciences, advertising agencies, financial services, payers and
  providers no-code access to real-world data and real-world evidence. HealthNexus aggregates
  billions of medical and pharmacy claims alongside provider, eligibility, remittance, EHR and
  mortality data into the CLEAR RWD dataset, which PurpleLab states is certified to HIPAA
  de-identification standards under the Expert Determination method. Alongside the no-code platform
  the company has marketed HealthNexus API Streams — subscription pre-built data feeds and scoring
  APIs covering provider profiles, locations, credentials, affiliations, performance and efficiency
  scores, payer influence and patient risk adjustment. PurpleLab has raised roughly $68M including a
  $40M Series B led by Primus Capital with Edison Partners, and acquired KAID Health in 2025. No
  public developer portal, API reference, or machine-readable contract is published; the API and
  platform surfaces sit behind HealthNexus SSO.
