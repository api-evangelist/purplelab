apis:
- name: HealthNexus API Streams
  description: >-
    Subscription-based, pre-built healthcare data feeds and scoring APIs that augment a client's
    internal datasets with PurpleLab's proprietary claims scoring, forecasting, ranking and
    segmentation. PurpleLab has marketed streams covering Provider Profiles, Provider Locations,
    Provider Migrations, Provider Credentials, Provider Qualifications, Provider Experience,
    Provider Practice Characteristics, Provider Affiliations, Industry Influence, Payer Influence,
    Provider Performance Scores, Provider Efficiency, Patient Risk Adjustment Factor and Patient
    SDOH. Access is commercial and gated; PurpleLab publishes no public reference, OpenAPI, or
    authentication documentation for it.
  humanURL: https://purplelab.com/platform
  baseURL: https://api.purplelab.com
  x-baseurl-provenance: >-
    PROBED, not documented. PurpleLab publishes no API reference stating a base URL.
    https://api.purplelab.com/ returned HTTP 200 application/json on 2026-08-26 and answers unknown
    paths with structured JSON 404 bodies, so it is a live first-party JSON API host on the
    company's own domain. A second first-party API host, https://api.healthnexus.io (AWS API
    Gateway, HTTP 403 {"message":"Forbidden"} on every anonymous path), backs the HealthNexus
    platform - https://portal.purplelab.com/ 307-redirects to
    https://api.healthnexus.io/healthnexussso/checklogin. Which host serves the Streams product is
    not stated publicly.
  tags:
